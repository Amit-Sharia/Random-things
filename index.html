<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Stuff</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1># RANDOM STUFF</h1>

    <div class="container">

        <div class="card">
            <h2># Cat Fact</h2>
            <button onclick="catFact()">Generate</button>
            <p id="catFact"></p>
        </div>

        <div class="card">
            <h2># Dog Image</h2>
            <button onclick="dogImage()">Generate</button>
            <img id="dogImage" style="display: none;">
        </div>

        <div class="card">
            <h2># Joke</h2>
            <button onclick="joke()">Generate</button>
            <p id="joke"></p>
        </div>

        <div class="card">
            <h2># Quote</h2>
            <button onclick="quote()">Generate</button>
            <p id="quote"></p>
        </div>

        <div class="card">
            <h2># Country</h2>
            <button onclick="country()">Generate</button>
            <p id="country"></p>
        </div>

        <div class="card">
            <h2># Recipe</h2>
            <button onclick="recipe()">Generate</button>
            <p id="recipe"></p>
        </div>

        <div class="card">
            <h2># Activity</h2>
            <button onclick="activity()">Generate</button>
            <p id="activity"></p>
        </div>

        <div class="card">
            <h2># Advice</h2>
            <button onclick="advice()">Generate</button>
            <p id="advice"></p>
        </div>

        <div class="card">
            <h2># Number Fact</h2>
            <button onclick="numberFact()">Generate</button>
            <p id="numberFact"></p>
        </div>

        <div class="card">
            <h2># Random User</h2>
            <button onclick="user()">Generate</button>
            <p id="user"></p>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
